# Site settings for GitHub Pages (Jekyll 3.10 + minima 2.5.1 overrides, whitelisted plugins only).
title: "Manskills DIY"
description: >-
  Step-by-step car maintenance, home repair, and small mechanical fixes for guys
  who never had anyone show them how. Nobody taught me this, so here it is:
  plain instructions, the right tools, and no fluff.
author: "Manskills DIY"
email: ""

url: "https://manskills.github.io"
# NOTE: baseurl becomes "" once the custom domain manskillsdiy.com is set up.
baseurl: "/manskillsdiy"

theme: minima
permalink: /:categories/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

minima:
  date_format: "%b %-d, %Y"

# Header nav is rendered from _data/navigation.yml by the overridden _includes/header.html.
# header_pages is kept so minima's fallback behaviour still works if the override is removed.
header_pages:
  - about.md
  - how-we-research.md
  - affiliate-disclosure.md

# Affiliate settings used by _includes/product-box.html, aff-link.html, disclosure-inline.html
affiliates:
  # Flip to true ONLY after the Amazon Associates account is approved. It turns on the
  # required statement "As an Amazon Associate I earn from qualifying purchases."
  amazon_enrolled: false
  # Default rel for every affiliate link. Deliberately no "noreferrer" (see report: Amazon
  # policy forbids obscuring the referring site).
  rel: "sponsored nofollow noopener"

markdown: kramdown
kramdown:
  auto_ids: true          # gives every heading an id so jump links work
show_excerpts: true

defaults:
  - scope: { path: "", type: "posts" }
    values:
      layout: "howto"
      author: "manskills"
  - scope: { path: "_drafts", type: "drafts" }
    values:
      layout: "howto"
      author: "manskills"
  - scope: { path: "", type: "pages" }
    values:
      layout: "page"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - _templates/
